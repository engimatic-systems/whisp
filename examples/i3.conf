# Change ~/projects/whisp below if your checkout lives elsewhere.
# Build first: cd ~/projects/whisp && cargo build --release --locked

# F10 launches Whisp if absent; otherwise it shows/hides the scratchpad window.
for_window [class="^whisp$" title="^Whisp$"] floating enable, move scratchpad, resize set 512 px 384 px, scratchpad show
bindsym F10 exec --no-startup-id bash ~/projects/whisp/scripts/toggle-i3.sh

# Optional: start Whisp at login so its native shortcuts are immediately available.
# exec --no-startup-id bash ~/projects/whisp/scripts/whisp

# F8 (push-to-talk) and F9 (recording toggle) are grabbed directly by Whisp.
# Leave them unbound in i3, or choose different shortcuts in Whisp's Settings.
