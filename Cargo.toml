[package]
name = "whisp"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
repository = "https://github.com/engimatic-systems/whisp"
description = "A small PipeWire dictation notepad for Linux"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
gtk = { package = "gtk4", version = "0.11", features = ["v4_8"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "multipart", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
x11rb = { version = "0.13", features = ["xkb"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
